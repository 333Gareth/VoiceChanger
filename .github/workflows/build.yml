name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper & Build APK
        run: |
          # Use pre-installed Gradle to generate a local wrapper
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          # Build using the wrapper with no-daemon to prevent hangs
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChanger-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
